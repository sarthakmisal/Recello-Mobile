<ion-content [fullscreen]="true" class="page-shell">
    <section class="auth-layout">
        <div class="auth-copy">
            <span class="eyebrow">{{ mode | titlecase }}</span>
            <h1>{{ copy.title }}</h1>
            <p>{{ copy.hero }}</p>
            <div class="auth-points">
                <div>
                    <strong>Responsive</strong>
                    <span>Works elegantly on phones</span>
                </div>
                <div>
                    <strong>Fast</strong>
                    <span>Minimal friction flow</span>
                </div>
            </div>
        </div>

        <form class="auth-card" (ngSubmit)="submit()">
            <h2>{{ copy.title }}</h2>
            <label *ngIf="mode === 'partner'"><span>Company</span><input [(ngModel)]="form.company" name="company"
                    placeholder="Business name" /></label>
            <label *ngIf="mode === 'partner'"><span>City</span><input [(ngModel)]="form.city" name="city"
                    placeholder="City" /></label>
            <label *ngIf="mode === 'login'"><span>Name</span><input [(ngModel)]="form.name" name="name"
                    placeholder="Full name" /></label>
            <label><span>Phone</span><input [(ngModel)]="form.phone" name="phone" placeholder="Mobile number" /></label>
            <label><span>Email</span><input [(ngModel)]="form.email" name="email" placeholder="Email address" /></label>
            <label *ngIf="mode === 'login'"><span>OTP</span><input [(ngModel)]="form.otp" name="otp"
                    placeholder="Enter OTP" /></label>
            <ion-button type="submit" color="primary">{{ copy.button }}</ion-button>
        </form>
    </section>
</ion-content>

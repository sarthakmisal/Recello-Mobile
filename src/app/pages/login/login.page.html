<div class="login-root">
  <div class="login-topbar">
    <button class="back-btn" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back"></ion-icon>
    </button>
  </div>

  <ion-content class="login-content" [scrollY]="false">
    <div class="login-body">

      <!-- Brand mark -->
      <div class="login-brand">
        <div class="login-mark">R</div>
        <div class="login-app-name">Recello</div>
      </div>

      <!-- Phone step -->
      <div class="login-card" *ngIf="step === 'phone'">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-sub">Enter your mobile number to receive a one-time password.</p>

        <div class="field-group">
          <div class="phone-input-row" [class.has-val]="phone">
            <div class="country-prefix">🇮🇳 +91</div>
            <input
              type="tel"
              placeholder="Enter 10-digit mobile"
              [(ngModel)]="phone"
              maxlength="10"
              inputmode="numeric"
              (keyup.enter)="requestOtp()"
            />
          </div>
        </div>

        <div class="field-error" *ngIf="error">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ error }}
        </div>

        <button class="auth-btn" (click)="requestOtp()" [disabled]="loading || phone.length < 10">
          <ion-spinner *ngIf="loading" name="crescent" style="width:18px;height:18px;margin-right:8px;"></ion-spinner>
          <span>{{ loading ? 'Sending OTP…' : 'Send OTP' }}</span>
          <ion-icon *ngIf="!loading" name="arrow-forward"></ion-icon>
        </button>

        <p class="login-note">
          By continuing, you agree to our
          <a href="#" class="note-link">Terms</a> &
          <a href="#" class="note-link">Privacy Policy</a>.
        </p>
      </div>

      <!-- OTP step -->
      <div class="login-card" *ngIf="step === 'otp'">
        <h1 class="login-title">Verify OTP</h1>
        <p class="login-sub">
          We sent a code to <strong>+91 {{ phone }}</strong>
        </p>

        <div class="field-group">
          <div class="otp-input-wrap" [class.has-val]="otp">
            <ion-icon name="key-outline" class="field-icon"></ion-icon>
            <input
              type="text"
              placeholder="Enter OTP"
              [(ngModel)]="otp"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
              (keyup.enter)="verifyOtp()"
            />
          </div>
        </div>

        <div class="field-error" *ngIf="error">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ error }}
        </div>

        <button class="auth-btn" (click)="verifyOtp()" [disabled]="loading || otp.length < 4">
          <ion-spinner *ngIf="loading" name="crescent" style="width:18px;height:18px;margin-right:8px;"></ion-spinner>
          <span>{{ loading ? 'Verifying…' : 'Verify & Login' }}</span>
          <ion-icon *ngIf="!loading" name="checkmark-circle-outline"></ion-icon>
        </button>

        <button class="resend-btn" (click)="resendOtp()">
          <ion-icon name="refresh-outline"></ion-icon>
          Didn't receive OTP? Change number
        </button>
      </div>

    </div>
  </ion-content>
</div>

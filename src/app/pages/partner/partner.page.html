<div class="partner-root">
  <div class="back-header">
    <button class="back-btn" (click)="back()" aria-label="Go back">
      <ion-icon name="arrow-back"></ion-icon>
    </button>
    <div class="header-titles">
      <div class="header-title">Become a Partner</div>
      <div class="header-sub">Sell more, earn more</div>
    </div>
    <div class="header-spacer"></div>
  </div>

  <ion-content class="partner-content" [scrollY]="true">
    <div class="page-pad">

      <!-- Hero banner -->
      <div class="partner-hero">
        <div class="partner-hero-glow"></div>
        <div class="ph-icon">
          <ion-icon name="people-outline"></ion-icon>
        </div>
        <h2 class="ph-title">Join 500+ Partners</h2>
        <p class="ph-sub">Grow your business with Recello's partner network and unlock exclusive pricing.</p>
      </div>

      <!-- Benefits grid -->
      <div class="benefits-grid">
        <div class="benefit-card" *ngFor="let b of benefits">
          <div class="benefit-icon" [style.background]="b.color + '18'">
            <ion-icon [name]="b.icon" [style.color]="b.color"></ion-icon>
          </div>
          <div class="benefit-title">{{ b.title }}</div>
          <div class="benefit-desc">{{ b.desc }}</div>
        </div>
      </div>

      <!-- Success state -->
      <div class="success-card" *ngIf="submitted">
        <ion-icon name="checkmark-circle" style="color: var(--c-teal); font-size: 48px;"></ion-icon>
        <div class="success-title">Application Submitted!</div>
        <div class="success-sub">Our team will reach out to you within 24 hours.</div>
      </div>

      <!-- Apply form -->
      <div class="apply-form" *ngIf="!submitted">
        <div class="form-title">Apply Now</div>

        <div class="field-wrap">
          <label class="field-label">Full Name</label>
          <div class="input-row">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <input type="text" placeholder="Your full name" [(ngModel)]="name" />
          </div>
        </div>

        <div class="field-wrap">
          <label class="field-label">Business Email</label>
          <div class="input-row">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input type="email" placeholder="you@business.com" [(ngModel)]="email" />
          </div>
        </div>

        <div class="field-wrap">
          <label class="field-label">Phone Number</label>
          <div class="input-row">
            <ion-icon name="call-outline" class="input-icon"></ion-icon>
            <input type="tel" placeholder="+91 98765 43210" [(ngModel)]="phone" />
          </div>
        </div>

        <button class="grad-btn" (click)="submit()" [disabled]="submitting">
          <span *ngIf="!submitting">
            <ion-icon name="send-outline"></ion-icon>
            Submit Application
          </span>
          <span *ngIf="submitting">Submitting…</span>
        </button>
      </div>

      <div class="bottom-pad"></div>
    </div>
  </ion-content>
</div>

<div class="faq-root">
  <div class="back-header">
    <button class="back-btn" (click)="back()" aria-label="Go back">
      <ion-icon name="arrow-back"></ion-icon>
    </button>
    <div class="header-titles">
      <div class="header-title">FAQ</div>
      <div class="header-sub">Help & support</div>
    </div>
    <div class="header-spacer"></div>
  </div>

  <ion-content class="faq-content" [scrollY]="true">
    <div class="page-pad">

      <!-- Hero section -->
      <div class="faq-hero">
        <div class="faq-hero-icon">
          <ion-icon name="help-circle-outline"></ion-icon>
        </div>
        <h2 class="faq-hero-title">How can we help?</h2>
        <p class="faq-hero-sub">Find quick answers to the most common questions about selling your device.</p>
      </div>

      <!-- FAQ sections -->
      <div class="faq-section" *ngFor="let sec of sections">
        <div class="sec-header">
          <div class="sec-icon" [style.background]="sec.color + '18'">
            <ion-icon [name]="sec.icon" [style.color]="sec.color"></ion-icon>
          </div>
          <span class="sec-title">{{ sec.title }}</span>
        </div>

        <div class="faq-items">
          <div class="faq-item" *ngFor="let item of sec.items" (click)="toggle(item.q)"
            [class.expanded]="isExpanded(item.q)">
            <div class="faq-q-row">
              <span class="faq-q">{{ item.q }}</span>
              <ion-icon name="chevron-down" class="faq-chevron" [class.rotated]="isExpanded(item.q)"></ion-icon>
            </div>
            <div class="faq-answer" *ngIf="isExpanded(item.q)">
              {{ item.a }}
            </div>
          </div>
        </div>
      </div>

      <!-- Contact CTA -->
      <div class="contact-card">
        <div class="contact-icon">
          <ion-icon name="headset-outline"></ion-icon>
        </div>
        <div class="contact-text">
          <div class="contact-title">Still have questions?</div>
          <div class="contact-sub">Our support team is available 9 AM – 9 PM daily.</div>
        </div>
        <button class="contact-btn">Chat Now</button>
      </div>

      <div class="bottom-pad"></div>
    </div>
  </ion-content>
</div>

<div class="orders-root">
    <div class="back-header">
        <button class="back-btn" (click)="back()" aria-label="Go back">
            <ion-icon name="arrow-back"></ion-icon>
        </button>
        <div class="header-titles">
            <div class="header-title">My Orders</div>
            <div class="header-sub">Track your sell requests</div>
        </div>
        <div class="header-spacer"></div>
    </div>

    <ion-content class="orders-content" [scrollY]="true">
        <div class="page-pad">

            <!-- Summary stats -->
            <div class="summary-row">
                <div class="summary-card" *ngFor="let s of stats">
                    <div class="summary-icon" [style.background]="s.color + '1A'">
                        <ion-icon [name]="s.icon" [style.color]="s.color"></ion-icon>
                    </div>
                    <div class="summary-val">{{ s.val }}</div>
                    <div class="summary-lbl">{{ s.label }}</div>
                </div>
            </div>

            <!-- Order cards -->
            <div class="section-label">RECENT ORDERS</div>
            <div class="order-card" *ngFor="let order of orders">
                <div class="order-top">
                    <div class="order-info">
                        <div class="order-device">{{ order.device }}</div>
                        <div class="order-id">{{ order.id }}</div>
                    </div>
                    <div class="status-badge" [style.background]="order.statusColor + '1A'">
                        <span [style.color]="order.statusColor">{{ order.status }}</span>
                    </div>
                </div>
                <div class="order-divider"></div>
                <div class="order-bottom">
                    <div class="order-meta">
                        <ion-icon name="star-outline"></ion-icon>
                        <span>{{ order.condition }}</span>
                    </div>
                    <div class="order-meta">
                        <ion-icon name="calendar-outline"></ion-icon>
                        <span>{{ order.date }}</span>
                    </div>
                    <div class="order-price">₹{{ order.price.toLocaleString('en-IN') }}</div>
                </div>
            </div>

            <!-- CTA -->
            <button class="grad-btn" (click)="sellAnother()" style="margin-top: 16px;">
                <ion-icon name="add-circle-outline"></ion-icon>
                Sell Another Device
            </button>

            <div class="bottom-pad"></div>
        </div>
    </ion-content>
</div>

<div class="sell-root">
  <div class="back-header">
    <button class="back-btn" (click)="back()" aria-label="Go back">
      <ion-icon name="arrow-back"></ion-icon>
    </button>
    <div class="header-titles">
      <div class="header-title">Sell Tablet</div>
      <div class="header-sub">iPads, Android tabs & more</div>
    </div>
    <div class="header-spacer"></div>
  </div>

  <ion-content class="sell-content" [scrollY]="true">
    <div class="page-pad">

      <div class="search-bar-wrap">
        <ion-icon name="search-outline"></ion-icon>
        <input type="search" placeholder="Search brand…" [(ngModel)]="search" />
      </div>

      <div class="section-label">SELECT BRAND</div>
      <div class="brand-grid">
        <button *ngFor="let brand of filteredBrands" class="brand-cell"
          [class.selected-teal]="selectedBrand?.name === brand.name" (click)="selectBrand(brand)">
          {{ brand.name }}
        </button>
      </div>

      <ng-container *ngIf="selectedBrand">
        <div class="section-label">DEVICE CONDITION</div>
        <div *ngFor="let cond of conditions" class="cond-row" [class.active-teal]="selectedCondition === cond.key"
          (click)="selectCondition(cond.key)">
          <div class="radio" [class.checked-teal]="selectedCondition === cond.key">
            <div class="radio-dot teal" *ngIf="selectedCondition === cond.key"></div>
          </div>
          <div class="cond-text">
            <div class="cond-label">{{ cond.label }}</div>
            <div class="cond-desc">{{ cond.desc }}</div>
          </div>
          <ion-icon name="checkmark-circle" *ngIf="selectedCondition === cond.key"
            style="color: var(--c-teal); font-size: 20px;"></ion-icon>
        </div>
      </ng-container>

      <div class="quote-wrap" *ngIf="quote !== null">
        <div class="quote-card grad-tablets">
          <div class="quote-label">Estimated Price Range</div>
          <div class="quote-price">{{ formatPrice(quote! * 0.85) }} – {{ formatPrice(quote!) }}</div>
          <div class="quote-sub">For {{ selectedBrand!.name }} · {{ selectedCondition }} condition</div>
          <button class="quote-action-btn">Get Exact Quote →</button>
        </div>
      </div>

      <div class="bottom-pad"></div>
    </div>
  </ion-content>
</div>

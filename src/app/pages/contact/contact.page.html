<ion-content [fullscreen]="true" class="page-shell">
    <section class="contact-layout">
        <div class="contact-copy">
            <span class="eyebrow">Support</span>
            <h1>Contact us</h1>
            <p>Reach out with a clean form and premium card layout.</p>
            <div class="contact-pill">recellosolutions@gmail.com</div>
            <div class="contact-pill">+91 91309 99924</div>
        </div>

        <form class="contact-card" (ngSubmit)="submit()">
            <label><span>Name</span><input [(ngModel)]="form.name" name="name" placeholder="Your name" /></label>
            <label><span>Email</span><input [(ngModel)]="form.email" name="email" placeholder="Email address" /></label>
            <label><span>Subject</span><input [(ngModel)]="form.subject" name="subject" placeholder="Subject" /></label>
            <label><span>Message</span><textarea [(ngModel)]="form.message" name="message" rows="5"
                    placeholder="Write your message"></textarea></label>
            <ion-button type="submit" color="primary">Send message</ion-button>
            <p *ngIf="saved" class="success">Saved locally and ready for support review.</p>
        </form>
    </section>
</ion-content>

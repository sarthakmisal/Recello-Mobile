<div class="header">
  <div class="header-row">
    <a class="brand" routerLink="/">
      <div class="brand-mark">R</div>
      <div class="brand-text">
        <span class="brand-name">Recello</span>
        <span class="brand-tagline">Sell smart, fast</span>
      </div>
    </a>

    <div class="header-actions">
      <button class="icon-btn" [class.search-active]="searchOpen" (click)="toggleSearch()"
        [attr.aria-label]="searchOpen ? 'Close search' : 'Search'">
        <ion-icon [name]="searchOpen ? 'close-outline' : 'search-outline'"></ion-icon>
      </button>
      <a *ngIf="auth.isLoggedIn" routerLink="/orders" class="icon-btn" aria-label="Orders">
        <ion-icon name="receipt-outline"></ion-icon>
      </a>
      <button class="icon-btn" (click)="openMenu()" aria-label="Menu">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>
  </div>

  <div class="search-wrapper" [class.open]="searchOpen">
    <div class="search-bar">
      <ion-icon name="search-outline"></ion-icon>
      <input type="search" placeholder='Search brands, models…' [value]="searchTerm"
        (input)="onSearchChange($any($event.target).value)" [autofocus]="searchOpen" autocomplete="off" />
      <button *ngIf="searchTerm" class="search-clear" (click)="clearSearch()" aria-label="Clear">
        <ion-icon name="close-circle"></ion-icon>
      </button>
    </div>
  </div>

  <div class="quick-nav">
    <button *ngFor="let item of navItems" class="nav-btn" [routerLink]="item.route"
      routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: item.route === '/' }">
      {{ item.label }}
    </button>
  </div>
</div>

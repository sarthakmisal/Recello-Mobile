<ion-content class="rc-login-modal">
    <div class="sheet-handle"></div>

    <div class="header">
        <div class="rc-eyebrow">
            <span class="rc-live-dot" aria-hidden="true"></span>
            <span class="rc-step-label">SECURE LOGIN</span>
        </div>
        <h2>Log in to continue</h2>
        <button class="close" (click)="close()" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <div class="rc-route" [class.rc-route--otp]="step === 'otp'" aria-hidden="true">
        <div class="rc-route-node">
            <span class="rc-route-dot"></span>
            <span class="rc-route-label">Mobile</span>
        </div>
        <div class="rc-route-track">
            <span class="rc-route-fill"></span>
            <span class="rc-route-puck"></span>
        </div>
        <div class="rc-route-node rc-route-node--end">
            <span class="rc-route-dot"></span>
            <span class="rc-route-label">Verify</span>
        </div>
    </div>

    <div class="body">
        <div *ngIf="step === 'phone'" class="rc-panel">
            <div class="rc-field rc-phone-field">
                <span class="rc-phone-code">+91</span>
                <input
                    class="rc-input rc-phone-input"
                    placeholder="10-digit mobile"
                    aria-label="Mobile number"
                    [(ngModel)]="phone"
                    inputmode="numeric"
                    maxlength="10"
                    [disabled]="isNewUser" />
            </div>

            <div *ngIf="isNewUser" class="new-user">
                <p>Looks like you're new here. What should we call you?</p>
                <input class="rc-input" placeholder="Your name" aria-label="Your name" [(ngModel)]="name" />
            </div>

            <button class="rc-btn-primary mt" [class.is-loading]="loading" (click)="start()" [disabled]="loading">
                <span class="rc-btn-spinner" *ngIf="loading" aria-hidden="true"></span>
                <span class="rc-btn-label">{{ isNewUser ? 'Send OTP' : 'Continue' }}</span>
            </button>
        </div>

        <div *ngIf="step === 'otp'" class="rc-panel">
            <p class="rc-subtle">Enter the OTP sent to <strong>{{ phone }}</strong></p>

            <div class="rc-otp-wrap">
                <input
                    class="rc-otp-input"
                    aria-label="One time password"
                    [(ngModel)]="otp"
                    inputmode="numeric"
                    maxlength="6" />
                <div class="rc-otp-boxes" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <button class="rc-btn-primary mt" [class.is-loading]="loading" (click)="verify()" [disabled]="loading">
                <span class="rc-btn-spinner" *ngIf="loading" aria-hidden="true"></span>
                <span class="rc-btn-label">Verify</span>
            </button>
            <button class="rc-back" (click)="resend()">Resend OTP</button>
        </div>

        <p class="error" *ngIf="error">
            <svg class="rc-error-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="7" cy="7" r="6.25" stroke="currentColor" stroke-width="1.3" />
                <path d="M7 4V7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                <circle cx="7" cy="9.7" r="0.75" fill="currentColor" />
            </svg>
            {{ error }}
        </p>
    </div>
</ion-content>

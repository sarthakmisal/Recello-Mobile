<ion-content class="rc-login-modal">
    <div class="sheet-handle"></div>

    <div class="header">
        <h2 class="rc-title">Secure Login</h2>
        <button class="icon-btn" (click)="close()" aria-label="Close">×</button>
    </div>

    <div class="body">
        <div *ngIf="step === 'phone'">
            <input class="rc-search" placeholder="10-digit mobile" [(ngModel)]="phone" inputmode="numeric" maxlength="10" [disabled]="isNewUser" />
            <div *ngIf="isNewUser" class="new-user-block">
                <p class="rc-subtle">Looks like you're new here. What should we call you?</p>
                <input class="rc-search" placeholder="Your name" [(ngModel)]="name" />
            </div>
            <button class="rc-btn-primary mt" (click)="start()" [disabled]="loading">{{ isNewUser ? 'Send OTP' : 'Continue' }}</button>
        </div>

        <div *ngIf="step === 'otp'">
            <p class="rc-subtle">Enter the OTP sent to {{ phone }}</p>
            <input class="rc-search" placeholder="OTP" [(ngModel)]="otp" inputmode="numeric" maxlength="6" />
            <button class="rc-btn-primary mt" (click)="verify()" [disabled]="loading">Verify</button>
            <button class="rc-back" (click)="resend()">Resend OTP</button>
        </div>

        <p class="rc-error-text" *ngIf="error">{{ error }}</p>
        <div class="loading-row" *ngIf="loading"><ion-spinner name="dots"></ion-spinner></div>
    </div>
</ion-content>

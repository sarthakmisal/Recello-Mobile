<ion-app>
  <!-- ── Slide-out drawer ──────────────────────────────── -->
  <ion-menu contentId="main-content" menuId="main-menu" side="start" type="overlay" [swipeGesture]="true">
    <ion-content class="menu-content" [scrollY]="false">
      <div class="menu-inner">

        <!-- Brand header -->
        <div class="menu-header">
          <div class="menu-brand-mark">R</div>
          <div class="menu-brand-info">
            <div class="menu-brand-name">Recello</div>
            <div class="menu-brand-sub">Sell smart, fast</div>
          </div>
          <ion-menu-toggle>
            <button class="menu-close" aria-label="Close menu">
              <ion-icon name="close"></ion-icon>
            </button>
          </ion-menu-toggle>
        </div>

        <!-- Guest card -->
        <div class="menu-guest-card">
          <div class="menu-avatar">
            <ion-icon name="person"></ion-icon>
          </div>
          <div class="menu-guest-info">
            <div class="menu-guest-name">Welcome, Guest</div>
            <div class="menu-guest-sub">Login to track orders</div>
          </div>
          <ion-menu-toggle>
            <a routerLink="/login" class="menu-login-pill">Login</a>
          </ion-menu-toggle>
        </div>

        <!-- Nav items -->
        <nav class="menu-nav">
          <ion-menu-toggle *ngFor="let item of navItems">
            <a [routerLink]="item.route" class="menu-nav-item" routerLinkActive="nav-active"
              [routerLinkActiveOptions]="{ exact: item.route === '/' }">
              <div class="menu-nav-icon">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <span class="menu-nav-label">{{ item.label }}</span>
              <ion-icon name="chevron-forward" class="menu-nav-arrow"></ion-icon>
            </a>
          </ion-menu-toggle>

          <div class="menu-divider"></div>

          <ion-menu-toggle *ngFor="let item of bottomItems">
            <a [routerLink]="item.route" class="menu-nav-item" [class.accent]="item.accent">
              <div class="menu-nav-icon" [class.accent-icon]="item.accent">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <span class="menu-nav-label">{{ item.label }}</span>
              <ion-icon name="chevron-forward" class="menu-nav-arrow"></ion-icon>
            </a>
          </ion-menu-toggle>
        </nav>

        <div class="menu-version">Recello v1.0</div>
      </div>
    </ion-content>
  </ion-menu>

  <!-- ── Main content ─────────────────────────────────── -->
  <div id="main-content" class="main-wrapper">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>

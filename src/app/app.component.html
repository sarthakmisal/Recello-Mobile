<ion-app [attr.data-theme]="theme.current">
  <ion-menu contentId="main-content" menuId="main-menu" side="start" type="overlay" [swipeGesture]="true">
    <ion-content class="menu-content" [scrollY]="true">
      <div class="menu-inner">

        <div class="menu-header">
          <div class="menu-brand">
            <div class="menu-brand-mark">R</div>
            <div class="menu-brand-info">
              <div class="menu-brand-name">Recello</div>
              <div class="menu-brand-sub">Sell smart, fast</div>
            </div>
          </div>
          <ion-menu-toggle>
            <button class="menu-close" aria-label="Close">
              <ion-icon name="close"></ion-icon>
            </button>
          </ion-menu-toggle>
        </div>

        <div class="menu-user-card" *ngIf="auth.isLoggedIn; else guestCard">
          <div class="menu-avatar menu-avatar--logged">
            <ion-icon name="person"></ion-icon>
          </div>
          <div class="menu-user-info">
            <div class="menu-user-name">{{ auth.user?.name || 'User' }}</div>
            <div class="menu-user-sub">{{ auth.user?.phone }}</div>
          </div>
        </div>
        <ng-template #guestCard>
          <div class="menu-guest-card">
            <div class="menu-avatar">
              <ion-icon name="person-outline"></ion-icon>
            </div>
            <div class="menu-guest-info">
              <div class="menu-guest-name">Welcome</div>
              <div class="menu-guest-sub">Login to track orders</div>
            </div>
            <ion-menu-toggle>
              <a routerLink="/login" class="menu-login-pill">Login</a>
            </ion-menu-toggle>
          </div>
        </ng-template>

        <div class="menu-section-label" *ngIf="serviceNavItems.length > 0">Sell Devices</div>
        <nav class="menu-nav" *ngIf="serviceNavItems.length > 0">
          <ion-menu-toggle *ngFor="let item of serviceNavItems">
            <a [routerLink]="item.route" class="menu-nav-item sell-item" routerLinkActive="nav-active">
              <div class="menu-nav-icon sell-icon">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <span class="menu-nav-label">{{ item.label }}</span>
              <ion-icon name="chevron-forward" class="menu-nav-arrow"></ion-icon>
            </a>
          </ion-menu-toggle>
        </nav>

        <div class="menu-section-label">Navigation</div>
        <nav class="menu-nav">
          <ion-menu-toggle *ngFor="let item of staticNavItems">
            <a [routerLink]="item.route" class="menu-nav-item" routerLinkActive="nav-active"
               [routerLinkActiveOptions]="{ exact: item.route === '/' }">
              <div class="menu-nav-icon">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <span class="menu-nav-label">{{ item.label }}</span>
              <ion-icon name="chevron-forward" class="menu-nav-arrow"></ion-icon>
            </a>
          </ion-menu-toggle>
        </nav>

        <div class="menu-divider"></div>

        <nav class="menu-nav">
          <ion-menu-toggle *ngFor="let item of bottomNavItems">
            <a [routerLink]="item.route" class="menu-nav-item" [class.accent]="item.accent">
              <div class="menu-nav-icon" [class.accent-icon]="item.accent">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <span class="menu-nav-label">{{ item.label }}</span>
              <ion-icon name="chevron-forward" class="menu-nav-arrow"></ion-icon>
            </a>
          </ion-menu-toggle>

          <ion-menu-toggle *ngIf="auth.isLoggedIn">
            <button class="menu-nav-item menu-nav-btn danger-item" (click)="logout()">
              <div class="menu-nav-icon danger-icon">
                <ion-icon name="log-out-outline"></ion-icon>
              </div>
              <span class="menu-nav-label">Logout</span>
            </button>
          </ion-menu-toggle>
        </nav>

        <div class="menu-footer">
          <div class="menu-theme-row">
            <ion-icon [name]="theme.isDark ? 'moon' : 'sunny-outline'"></ion-icon>
            <span>{{ theme.isDark ? 'Dark Mode' : 'Light Mode' }}</span>
            <button class="theme-toggle-btn" (click)="theme.toggle()" [class.dark]="theme.isDark">
              <div class="theme-knob"></div>
            </button>
          </div>
          <div class="menu-version">Recello v1.0</div>
        </div>

      </div>
    </ion-content>
  </ion-menu>

  <div id="main-content" class="main-wrapper">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
